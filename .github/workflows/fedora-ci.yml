name: Fedora 45 CSharp OS Course CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-correctness-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: fedora:45

    steps:
      - name: Install Fedora dependencies
        run: |
          dnf install -y \
            git \
            dotnet-sdk-10.0 \
            procps-ng \
            psmisc \
            strace \
            coreutils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show pinned environment
        run: |
          cat /etc/fedora-release
          dotnet --info
          uname -a

      - name: Build all CSharp chapters
        run: bash ./build.sh

      - name: Correctness and invariant tests
        run: bash ./verify.sh
