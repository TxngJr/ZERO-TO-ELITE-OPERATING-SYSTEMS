name: Fedora Course CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install tools
        run: dnf install -y git gcc make python3

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build whole core course
        run: make core-build

      - name: Python syntax check
        run: make python-check

      - name: Whole-course smoke tests
        shell: bash
        run: |
          set -euxo pipefail
          ulimit -c 0
          make smoke
